server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Résolveur DNS interne de Docker. Sans lui, nginx résout le nom
    # du service une seule fois au démarrage et garde l'adresse en
    # cache : un redémarrage de l'API laisserait la vue aveugle.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # La vue et l'API sont servies sous la même origine. Aucune
    # requête inter-origine, donc aucune dépendance aux politiques
    # du navigateur sur les adresses privées.
    location /api/ {
        set $twin_api http://digital_twin_api:4010;
        proxy_pass $twin_api$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # L'état du jumeau numérique ne doit jamais être servi
        # depuis un cache : une vue de supervision qui affiche une
        # valeur périmée est pire qu'une vue vide.
        proxy_no_cache     1;
        proxy_cache_bypass 1;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;

        proxy_connect_timeout 5s;
        proxy_send_timeout    10s;
        proxy_read_timeout    10s;
    }

    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    location /assets/ {
        add_header Cache-Control "no-cache" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
