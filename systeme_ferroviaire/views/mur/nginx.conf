server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # Le mur interroge la Digital Twin API pour la mise en évidence
    # des compartiments : proxifiée en même origine pour éviter tout
    # blocage inter-origine ou contenu mixte en HTTPS.
    location /api/ {
        set $twin_api http://digital_twin_api:4010;
        proxy_pass $twin_api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
        add_header Cache-Control "no-store" always;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    location = /index.html { add_header Cache-Control "no-store" always; }
    location /assets/ { add_header Cache-Control "public, max-age=86400" always; }
    location / { try_files $uri $uri/ /index.html; }
}
