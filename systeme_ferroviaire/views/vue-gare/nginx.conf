server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Résolveur DNS interne de Docker : sans lui, nginx fige
    # l'adresse de l'API au démarrage et un redémarrage de
    # celle-ci laisserait la vue aveugle.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # L'API est servie sous la même origine que la page. C'est
    # indispensable en HTTPS : une page en https appelant une API
    # en http est bloquée par le navigateur (contenu mixte), sans
    # message visible pour l'opérateur.
    location /api/ {
        set $twin_api http://digital_twin_api:4010;
        proxy_pass $twin_api$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_no_cache     1;
        proxy_cache_bypass 1;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;

        proxy_connect_timeout 5s;
        proxy_send_timeout    10s;
        proxy_read_timeout    10s;
    }

    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    location ~* \.(css|js)$ {
        add_header Cache-Control "no-cache" always;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=86400" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
